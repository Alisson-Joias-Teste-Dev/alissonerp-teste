<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<title>Catálogo — Alta Joalheria</title>

<!-- Filson Pro e The Seasons não estão em CDNs abertas.
     Uso fallbacks editoriais bem próximos: Fraunces (display serif — substituto
     de The Seasons) e Manrope (sans geométrico — substituto de Filson Pro).
     Quando você tiver as fontes próprias em .woff2, basta trocar os @font-face. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Manrope:wght@300;400;500;600;700&display=swap" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="page-settings.js?v=4"></script>
<script src="erp-api.js?v=4"></script>
<script src="catalog-overrides.js?v=3"></script>

<style>
  :root {
    --green: #184036;
    --green-deep: #0f2b24;
    --champagne: #f3eada;
    --champagne-soft: #f9f3e8;
    --white: #ffffff;
    --ink: #1a1a1a;
    --muted: #8a8372;
    --line: rgba(24,64,54,.14);
    --sans: 'Filson Pro', 'Manrope', system-ui, sans-serif;
    --serif: 'The Seasons', 'Fraunces', Georgia, serif;
    --radius: 0px;
    --intensity: 1;
    --speed: 1;
    --col-count: 4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--white); color: var(--ink); }
  body { font-family: var(--sans); font-weight: 400; line-height: 1.5; -webkit-font-smoothing: antialiased; }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  /* ─── TOP BAR ──────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--green);
    color: var(--champagne);
    border-bottom: 1px solid rgba(243,234,218,.1);
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto;
    padding: 14px 40px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 40px;
  }
  .nav-left, .nav-right {
    display: flex; gap: 26px;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500;
  }
  .nav-right { justify-content: flex-end; }
  .nav-left a, .nav-right a { opacity: .72; transition: opacity .25s; position: relative; }
  .nav-left a:hover, .nav-right a:hover { opacity: 1; }
  .nav-left a.is-active { opacity: 1; }
  .nav-left a.is-active::after {
    content: '';
    position: absolute; left: 0; right: 0; bottom: -8px;
    height: 1px;
    background: var(--champagne);
  }
  .wordmark {
    text-align: center;
    display: flex; align-items: center; justify-content: center;
    min-width: 0;
    padding: 0 12px;
    position: relative;
  }
  .wordmark::before,
  .wordmark::after {
    content: '';
    position: absolute; top: 50%;
    width: 22px; height: 1px;
    background: rgba(243,234,218,.28);
  }
  .wordmark::before { right: 100%; }
  .wordmark::after  { left: 100%; }
  .wordmark img {
    height: 32px; width: auto;
    max-width: 100%;
    display: block;
    object-fit: contain;
  }

  .announce {
    background: var(--green-deep); color: rgba(243,234,218,.72);
    font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; text-align: center;
    padding: 8px 12px;
  }

  /* ─── HERO ─────────────────────────────────────────────── */
  .hero {
    position: relative;
    background: linear-gradient(180deg, #fdfaf3 0%, #faf3e3 50%, #f0e3c2 100%);
    overflow: hidden;
    min-height: 92vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    perspective: none;         /* não cria stacking context, mix-blend-mode funciona */
    isolation: auto;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 70% 50%, rgba(255,255,255,.85) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 20%, rgba(24,64,54,.04) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero-copy {
    position: relative; z-index: 2;
    padding: 0 40px 0 80px;
  }
  .hero-kicker {
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--green); font-weight: 500; margin-bottom: 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .hero-kicker::before {
    content: ''; width: 28px; height: 1px; background: var(--green); display: inline-block;
  }
  .hero-title {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(48px, 6.2vw, 92px);
    line-height: .98;
    letter-spacing: -.01em;
    color: var(--green-deep);
    margin-bottom: 28px;
    text-wrap: balance;
  }
  .hero-title em { font-style: italic; color: #6b5530; }
  .hero-sub {
    font-size: 15px; line-height: 1.65; color: #4a4230; max-width: 460px;
    margin-bottom: 40px;
  }
  .hero-actions { display: flex; gap: 16px; align-items: center; }
  .btn-solid {
    background: var(--green); color: var(--champagne);
    padding: 16px 32px; border: 0;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500;
    transition: background .3s;
  }
  .btn-solid:hover { background: var(--green-deep); }
  .btn-ghost {
    background: transparent; color: var(--green-deep);
    padding: 16px 8px; border: 0;
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500;
    border-bottom: 1px solid var(--green-deep);
  }

  /* Hero 3D jewel stage */
  .hero-jewel-stage {
    position: relative;
    height: 100%; min-height: 600px;
    width: 100%;
    background: transparent;
    overflow: hidden;           /* necessário para clipar o iframe maior */
    perspective: none;          /* evita stacking context que bloqueia mix-blend-mode */
    display: flex; align-items: center; justify-content: center;
  }
  /* iJewel iframe sobreposto ao hero — fundo branco some por multiply */
  .hero-iframe-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: auto;
  }
  .hero-iframe-mask iframe {
    position: absolute;
    /* Aumentado para cortar barra lateral e logo do iJewel */
    width: 148%;
    height: 148%;
    top: -24%;
    left: -24%;
    border: none;
    mix-blend-mode: multiply;
    pointer-events: auto;
    display: block;
  }
  .hero-jewel-inner {
    width: 380px; height: 380px;
    position: relative;
    transform-style: preserve-3d;
    will-change: transform;
  }
  /* Bracelete estilizado em CSS com múltiplas camadas */
  .hero-ring {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
  }
  .hero-ring-face {
    position: absolute;
    border-radius: 50%;
    box-shadow: inset 0 0 30px rgba(255,255,255,.4);
  }
  .hero-ring-front {
    inset: 60px;
    border: 42px solid;
    border-image: linear-gradient(135deg, #f6d89a 0%, #e1a95e 40%, #b07a2e 70%, #f0c578 100%) 1;
    border-radius: 50%;
    background: transparent;
    transform: translateZ(20px);
    box-shadow:
      0 0 60px rgba(193,139,61,.4),
      inset 0 0 20px rgba(255,255,255,.3);
  }
  .hero-ring-back {
    inset: 60px;
    border: 42px solid rgba(176,122,46,.5);
    border-radius: 50%;
    transform: translateZ(-20px);
    filter: blur(1px);
  }
  .hero-ring-inner {
    inset: 95px;
    background:
      radial-gradient(circle at 30% 30%, #fef2d2 0%, #e8bb70 50%, #a87628 100%);
    border-radius: 50%;
    transform: translateZ(0px) scale(.7);
    box-shadow: inset 0 0 40px rgba(107,70,20,.4);
    opacity: 0;
  }
  .hero-ring-gem {
    position: absolute;
    top: 40px; left: 50%;
    width: 48px; height: 48px;
    transform: translate(-50%, 0) translateZ(60px) rotate(45deg);
    background: linear-gradient(135deg, #ffffff 0%, #f0e8d0 40%, #ffffff 70%, #e8d8a8 100%);
    box-shadow:
      0 0 30px rgba(255,255,255,.9),
      0 0 60px rgba(255,220,150,.6),
      inset 0 0 15px rgba(255,255,255,.8);
    clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  }
  .hero-jewel-shadow {
    position: absolute;
    bottom: 20%; left: 50%;
    width: 320px; height: 40px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(24,64,54,.35) 0%, transparent 70%);
    filter: blur(8px);
    pointer-events: none;
  }

  /* ─── COLEÇÕES ─────────────────────────────────────────── */
  .collections {
    padding: 120px 40px 40px;
    max-width: 1440px; margin: 0 auto;
  }
  .collection {
    margin-bottom: 56px;
  }
  .collection-header {
    text-align: center; margin-bottom: 36px;
  }
  .collection-kicker {
    display: inline-block;
    font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--green); opacity: .7; font-weight: 500; margin-bottom: 14px;
  }
  .collection-title {
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(36px, 3.6vw, 52px);
    color: var(--green-deep); letter-spacing: -.01em;
    line-height: 1.05;
    margin-bottom: 10px;
  }
  .collection-sub {
    font-size: 14px; color: var(--muted); font-style: italic;
    font-family: var(--serif); font-weight: 300;
  }

  /* ─── VITRINE ──────────────────────────────────────────── */
  .vitrine-stage {
    position: relative;
    height: 380px;
    background: linear-gradient(180deg, var(--green-deep) 0%, var(--green) 25%, #c6a865 100%);
    overflow: hidden;
    perspective: 1600px;
    perspective-origin: 50% 55%;
    cursor: crosshair;
    margin-bottom: 24px;
  }
  .vitrine-light {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 55%, rgba(255,240,200,.55) 0%, transparent 60%),
      radial-gradient(ellipse 40% 30% at 50% 80%, rgba(255,255,255,.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .vitrine-item {
    position: absolute;
    top: 50%; left: 50%;
    width: 440px; height: 300px;
    transform: translate(-50%, -50%);
    transform-style: preserve-3d;
    will-change: transform;
    display: flex; align-items: center; justify-content: center;
  }
  .vitrine-placeholder {
    width: 100%; height: 100%;
    background: rgba(243,234,218,.95);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 40px 80px rgba(0,0,0,.35),
      0 20px 40px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.6);
  }
  .vitrine-shadow {
    position: absolute;
    bottom: 8%; left: 50%;
    width: 60%; height: 30px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,.5) 0%, transparent 70%);
    filter: blur(12px);
    pointer-events: none;
  }
  .vitrine-badge {
    position: absolute;
    top: 32px; left: 32px;
    color: var(--champagne);
    z-index: 2;
    display: flex; flex-direction: column; gap: 4px;
  }
  .vitrine-badge-kicker {
    font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
    opacity: .7; font-weight: 500;
  }
  .vitrine-badge-title {
    font-family: var(--serif); font-weight: 300; font-size: 22px; letter-spacing: .02em;
  }

  /* ─── VITRINE IFRAME (iJewel embed) ───────────────────────── */
  /* Remove perspective para não criar stacking context que bloqueia mix-blend-mode */
  .vitrine-has-iframe {
    perspective: none !important;
  }
  .vitrine-iframe-mask {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: auto;
  }
  .vitrine-iframe-mask iframe {
    position: absolute;
    /* Tamanho maior que o container para esconder barra lateral e logo */
    width: 140%;
    height: 140%;
    top: -20%;
    left: -20%;
    border: none;
    mix-blend-mode: multiply;
    pointer-events: auto;
  }

  /* ─── SCROLL REVEAL ────────────────────────────────────────── */
  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity .75s ease, transform .75s cubic-bezier(.2,.8,.2,1);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: none;
  }

  /* ─── FOTO EDITORIAL (galeria por categoria) ──────────────── */
  .cg-editorial-photo {
    width: 100%; height: 100%;
    border: none; padding: 0;
    background: #f0e8d8;
    position: relative; overflow: hidden;
    display: block;
    font-family: inherit;
  }
  .cg-editorial-photo-img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
    transition: transform .9s cubic-bezier(.2,.8,.2,1);
  }
  .cg-editorial-photo:hover .cg-editorial-photo-img {
    transform: scale(1.05);
  }

  /* ─── GRID DE PRODUTOS ─────────────────────────────────── */
  /* ─── CARROSSEL ────────────────────────────────────────── */
  .carousel-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .carousel-track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: calc((100% - (var(--cols, 4) - 1) * 24px) / var(--cols, 4));
    gap: 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    padding: 4px 4px 20px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .carousel-track::-webkit-scrollbar { display: none; }
  .carousel-item {
    scroll-snap-align: start;
    min-width: 0;
  }
  .carousel-arrow {
    position: absolute;
    top: 38%;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--white);
    color: var(--green-deep);
    border: 1px solid var(--line);
    display: grid; place-items: center;
    cursor: pointer;
    z-index: 3;
    transition: background .25s, transform .25s, opacity .25s;
    box-shadow: 0 8px 24px rgba(24,64,54,.1);
  }
  .carousel-arrow:hover:not(:disabled) {
    background: var(--green-deep); color: var(--champagne);
    transform: translateY(-50%) scale(1.06);
  }
  .carousel-arrow:disabled { opacity: .3; cursor: default; }
  .carousel-arrow-left  { left: -24px; transform: translateY(-50%); }
  .carousel-arrow-right { right: -24px; transform: translateY(-50%); }
  .carousel-arrow:hover:not(:disabled) { transform: translateY(-50%) scale(1.06); }
  .product-card {
    background: var(--white);
    border: 1px solid var(--line);
    display: flex; flex-direction: column;
    transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s;
    perspective: 1000px;
    cursor: pointer;
    height: 100%;
  }
  .product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 40px rgba(24,64,54,.08);
  }
  .product-img-stage {
    position: relative;
    aspect-ratio: 1 / 1;
    background: var(--champagne-soft);
    overflow: hidden;
    transform-style: preserve-3d;
  }
  .product-img-inner {
    position: absolute; inset: 16%;
    transform-style: preserve-3d;
    will-change: transform;
    transition: transform 0s;
  }
  .product-glare {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.4) 0%, transparent 40%, transparent 60%, rgba(243,234,218,.3) 100%);
    opacity: 0; transition: opacity .4s;
    pointer-events: none;
  }
  .product-card:hover .product-glare { opacity: 1; }

  .product-fav {
    position: absolute; top: 14px; right: 14px;
    width: 34px; height: 34px;
    border: 0; background: rgba(255,255,255,.88); backdrop-filter: blur(8px);
    color: var(--green-deep);
    display: grid; place-items: center;
    border-radius: 50%;
    opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s;
  }
  .product-card:hover .product-fav { opacity: 1; transform: translateY(0); }
  .product-fav:hover { color: #b44; background: #fff; }

  .product-body {
    padding: 20px 22px 22px;
    display: flex; flex-direction: column; gap: 14px;
    flex: 1;
  }
  .product-head { display: flex; flex-direction: column; gap: 4px; }
  .product-name {
    font-family: var(--serif); font-weight: 400;
    font-size: 17px; color: var(--green-deep); letter-spacing: -.005em;
  }
  .product-desc {
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }

  .product-price { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
  .price-row { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
  .price-lbl {
    font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; min-width: 28px;
  }
  .price-old { color: var(--muted); font-size: 12.5px; }
  .price-now strong {
    color: var(--green-deep); font-weight: 600; font-size: 16px;
    font-variant-numeric: tabular-nums;
  }

  .product-cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--green); color: var(--champagne);
    padding: 13px 16px;
    font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; font-weight: 500;
    transition: background .3s, gap .3s;
    margin-top: 4px;
    border: 0; cursor: pointer;
    font-family: inherit;
  }
  .product-cta:hover { background: var(--green-deep); gap: 14px; }

  /* ─── MODAL DE DETALHES DO PRODUTO ─────────────────────── */
  .pd-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(15, 30, 26, .55);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
    animation: pd-fade .3s ease;
  }
  @keyframes pd-fade { from { opacity: 0; } to { opacity: 1; } }
  .pd-modal {
    background: var(--white);
    width: 100%; max-width: 1200px;
    max-height: 92vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    position: relative;
    animation: pd-slide .4s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes pd-slide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .pd-close {
    position: absolute; top: 20px; right: 20px; z-index: 2;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    color: var(--green-deep);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .pd-close:hover { background: var(--green-deep); color: var(--champagne); }

  .pd-gallery {
    background: var(--champagne-soft);
    padding: 40px;
    display: flex; flex-direction: column; gap: 16px;
    position: sticky; top: 0;
    align-self: start;
    max-height: 92vh;
  }
  .pd-main-img {
    aspect-ratio: 1 / 1;
    background: var(--white);
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(24,64,54,.12);
  }
  .pd-thumbs {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .pd-thumb {
    aspect-ratio: 1 / 1;
    background: var(--white);
    border: 2px solid transparent;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .25s, transform .25s;
  }
  .pd-thumb:hover { transform: translateY(-2px); }
  .pd-thumb.active { border-color: var(--green-deep); }

  .pd-info {
    padding: 60px 56px;
    display: flex; flex-direction: column; gap: 40px;
  }
  .pd-kicker {
    font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
  }
  .pd-title {
    font-family: var(--serif); font-weight: 300;
    font-size: clamp(30px, 3vw, 40px);
    line-height: 1.1; color: var(--green-deep);
    letter-spacing: -.01em;
    margin-top: -28px;
  }
  .pd-lead {
    font-size: 15px; line-height: 1.75; color: #3f3a2e;
    max-width: 52ch;
  }

  .pd-price-block {
    display: flex; flex-direction: column; gap: 6px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .pd-price-row { display: flex; align-items: baseline; gap: 10px; }
  .pd-price-lbl {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); font-weight: 500; min-width: 32px;
  }
  .pd-price-old { color: var(--muted); font-size: 15px; }
  .pd-price-now strong {
    color: var(--green-deep); font-weight: 500; font-size: 28px;
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
  }
  .pd-install { font-size: 13px; color: var(--muted); font-style: italic; }

  .pd-cta {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 14px;
    align-self: flex-start;
    background: var(--green-deep); color: var(--champagne);
    padding: 20px 40px;
    font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 500;
    overflow: hidden;
    transition: color .4s ease, letter-spacing .4s ease;
  }
  .pd-cta::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(120deg, var(--gold) 0%, #d4b878 50%, var(--gold) 100%);

  .pd-cta:hover::before { transform: translateX(0); }
  .pd-cta:hover { color: var(--green-deep); letter-spacing: .28em; }
  .pd-cta > svg, .pd-cta > span { position: relative; z-index: 1; }
  .pd-cta > svg {
    opacity: .85;
    transition: transform .4s ease;
  }
  .pd-cta:hover > svg { transform: translateX(2px); opacity: 1; }

  /* Blocos editoriais (características / cuidados) */
  .pd-block { display: flex; flex-direction: column; gap: 20px; }
  .pd-block-title {
    font-family: var(--serif); font-weight: 400;
    font-size: 22px; letter-spacing: .05em;
    color: var(--green-deep);
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }
  .pd-block-sub {
    font-size: 14px; color: #4a4230; line-height: 1.6;
  }
  .pd-feat-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 28px 40px;
    margin-top: 4px;
  }
  .pd-feat {
    display: flex; flex-direction: column; gap: 4px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .pd-feat dt {
    font-size: 13px; color: var(--green-deep); font-weight: 500;
  }
  .pd-feat dd {
    font-size: 12px; color: var(--muted);
    font-family: var(--serif); font-style: italic; font-weight: 300;
  }
  .pd-care-lead strong {
    display: block; font-size: 14px; color: var(--green-deep);
    font-weight: 600; margin-bottom: 8px;
  }
  .pd-care-lead p {
    font-size: 13px; line-height: 1.7; color: var(--muted);
    max-width: 56ch;
  }
  .pd-discover {
    align-self: flex-start;
    background: transparent; color: var(--green-deep);

    .pd-feat-grid { grid-template-columns: 1fr; gap: 20px; }
  }

  /* ─── PLACEHOLDER DE JOIA ──────────────────────────────── */
  .jewel-ph {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .jewel-ph-stripes { position: absolute; inset: 0; opacity: .55; }
  .jewel-ph-label {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
  }
  .jewel-ph-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
  .jewel-ph-meta {
    position: absolute; bottom: 16px; left: 0; right: 0;
    text-align: center;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    opacity: .7;

  /* ─── ORNAMENTO DE MARCA ───────────────────────────────── */
  .brand-ornament {
    position: relative;
    padding: 90px 40px 60px;
    text-align: center;
    background: var(--champagne);
    overflow: hidden;
  }
  .brand-ornament::before,
  .brand-ornament::after {
    content: ''; position: absolute; top: 50%;
    width: clamp(80px, 24vw, 320px); height: 1px;
    background: linear-gradient(90deg, transparent, var(--green-deep), transparent);
    opacity: .4;
  }
  .brand-ornament::before { left: 0; transform: translateX(-10%); }
  .brand-ornament::after  { right: 0; transform: translateX(10%) scaleX(-1); }
  .brand-ornament-initial {
    font-family: var(--serif);
    font-weight: 300; font-style: italic;
    font-size: clamp(64px, 9vw, 120px);
    line-height: 1;
    color: var(--green-deep);
    letter-spacing: -.02em;
    position: relative; z-index: 2;
    display: inline-block;
  }
  .brand-ornament-initial::before,
  .brand-ornament-initial::after {
    content: '·';
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 24px; color: var(--gold); opacity: .9;
    font-style: normal;
  }
  .brand-ornament-initial::before { left: -34px; }
  .brand-ornament-initial::after { right: -34px; }
  .brand-ornament-tag {
    display: block;
    margin-top: 10px;
    font-size: 10px; letter-spacing: .42em; text-transform: uppercase;

      0deg,
      var(--white) 0%,
      rgba(255,255,255,0.55) 30%,
      rgba(33,46,38,0) 100%

    z-index: 1;

  .brand-watermark img {
    max-width: min(420px, 70vw);
    height: auto;
    opacity: .96;
    position: relative;
    z-index: 2;
  }
  .brand-watermark-line {
    position: relative;
    font-size: 10px; letter-spacing: .42em; text-transform: uppercase;
    color: rgba(243,234,218,.55); font-weight: 500;
    z-index: 2;
    display: inline-flex; align-items: center; gap: 18px;
  }
  .brand-watermark-line::before,
  .brand-watermark-line::after {
    content: '';
    width: 28px; height: 1px;
    background: rgba(243,234,218,.32);

  /* ─── FOOTER ───────────────────────────────────────────── */
  footer {

    );

    content: '';

  .footer-inner {
    position: relative;

    font-size: 13px; line-height: 1.75; max-width: 320px;

  .footer-col h5 {
    font-family: var(--serif);

    padding-bottom: 14px;

    content: '';

    list-style: none;

  .footer-col a:hover { opacity: 1; transform: translateX(3px); }
  .footer-meta {
    position: relative;
    max-width: 1320px; margin: 0 auto;

    font-size: 10px; letter-spacing: .24em; text-transform: uppercase;

    font-weight: 500;
  }
  .footer-meta span:nth-child(2) {
    font-style: italic; text-transform: none; letter-spacing: .08em;
    font-family: var(--serif); font-size: 12px;
    color: rgba(243,234,218,.55);

  /* ─── RESPONSIVO ───────────────────────────────────────── */
  @media (max-width: 1100px) {
    .hero { grid-template-columns: 1fr; min-height: auto; padding: 80px 0; }

    .vitrine-item { width: 300px; height: 220px; }
    .hero-copy { padding: 0 24px; }

  /* ─── GALERIAS POR CATEGORIA (mosaico Tiffany) ─────────────────────────── */
  .cg-root {
    background: #fff;
    padding: 80px 40px 60px;
    max-width: 1440px; margin: 0 auto;
  }
  .cg-root.cg-focused {
    padding-top: 56px;
    min-height: 80vh;
  }
  .cg-back {
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase; font-weight: 500;
    color: var(--green);
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 24px;
    opacity: .65;
    transition: opacity .25s, transform .25s;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .cg-back:hover { opacity: 1; transform: translateX(-3px); }
  .cg-back span { font-size: 16px; font-weight: 400; letter-spacing: 0; }
  .cg-section {
    margin-bottom: 96px;
    scroll-margin-top: 100px;
  }
  .cg-section:last-child { margin-bottom: 40px; }
  .cg-header {
    text-align: center;
    margin-bottom: 48px;
    position: relative;
    padding-bottom: 32px;
  }
  .cg-header::after {
    content: '';
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 32px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  .cg-kicker {
    display: inline-block;
    font-size: 10px; letter-spacing: .35em; text-transform: uppercase; font-weight: 500;
    color: var(--green-light, #2a5547); opacity: .7;
    margin-bottom: 14px;
  }
  .cg-title {
    font-family: var(--serif);
    font-size: clamp(38px, 5vw, 64px);
    font-weight: 400;
    color: var(--green);
    line-height: 1; letter-spacing: -.01em;
    margin-bottom: 12px;
  }
  .cg-sub {
    font-size: 14px; color: rgba(24,64,54,.6);
    font-style: italic; font-family: var(--serif);
    max-width: 480px; margin: 0 auto;
  }
  .cg-count {
    display: block;
    margin-top: 16px;
    font-size: 10px; letter-spacing: .25em; text-transform: uppercase;
    color: rgba(24,64,54,.4); font-weight: 500;
  }
  .cg-empty {
    text-align: center;
    padding: 80px 24px 100px;
    max-width: 540px; margin: 0 auto;
    color: rgba(24,64,54,.55);
    font-size: 15px; line-height: 1.6;
    font-family: var(--serif); font-style: italic;
    border-top: 1px solid rgba(24,64,54,.08);
    border-bottom: 1px solid rgba(24,64,54,.08);
  }

  .cg-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-flow: dense;
    gap: 8px;
  }
  .cg-compact .cg-grid { gap: 4px; grid-template-columns: repeat(5, 1fr); }
  .cg-wide .cg-grid    { gap: 14px; grid-template-columns: repeat(4, 1fr); }

  .cg-slot {
    position: relative;
    overflow: hidden;
    background: #f8f5ee;
    aspect-ratio: 1 / 1;
  }
  .cg-slot-sm { grid-column: span 1; grid-row: span 1; }
  .cg-slot-lg { grid-column: span 2; grid-row: span 2; aspect-ratio: 1 / 1; }
  .cg-slot-edt-tall { grid-column: span 1; grid-row: span 2; aspect-ratio: 1 / 2; }
  .cg-slot-edt-wide { grid-column: span 2; grid-row: span 2; aspect-ratio: 1 / 1; }

  /* Card produto */
  .cg-card {
    position: relative;
    width: 100%; height: 100%;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    overflow: hidden;
    font-family: inherit;
    color: inherit;
    text-align: left;
  }
  .cg-card-img {
    width: 100%; height: 100%;
    transition: transform .8s cubic-bezier(.2,.8,.2,1);
  }
  .cg-card:hover .cg-card-img { transform: scale(1.04); }
  .cg-card-img > * {
    width: 100% !important;
    height: 100% !important;
  }
  .cg-card-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 18px 16px 14px;
    background: linear-gradient(180deg, transparent 0%, rgba(24,64,54,.78) 100%);
    color: var(--champagne);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .35s, transform .35s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .cg-card:hover .cg-card-overlay,
  .cg-card:focus-visible .cg-card-overlay {
    opacity: 1;
    transform: translateY(0);
  }
  .cg-card-name {
    font-family: var(--serif);
    font-size: 13px; font-style: italic; line-height: 1.2;
    color: #fff;
  }
  .cg-card-price {
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(243,234,218,.85); font-weight: 500;
  }
  .cg-slot-lg .cg-card-name,
  .cg-slot-edt-wide .cg-card-name { font-size: 18px; }

  /* Editorial */
  .cg-editorial {
    width: 100%; height: 100%;
    position: relative;
    overflow: hidden;
  }
  .cg-editorial-tag {
    position: absolute;
    bottom: 14px; left: 14px;
    font-size: 9px; letter-spacing: .25em; text-transform: uppercase;
    font-weight: 500; opacity: .7;
  }

  @media (max-width: 920px) {
    .cg-root { padding: 56px 16px 40px; }
    .cg-grid { grid-template-columns: repeat(3, 1fr) !important; }
    .cg-slot-edt-tall, .cg-slot-edt-wide, .cg-slot-lg {
      grid-column: span 2; grid-row: span 2;

  @media (max-width: 560px) {
    .cg-grid { grid-template-columns: repeat(2, 1fr) !important; }

  /* ─── CAMPANHA DIA DAS MÃES ──────────────────────────────── */
  .announce-campaign {
    background: linear-gradient(90deg, #0f2b24 0%, #1a3d32 50%, #0f2b24 100%);

    font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase;

  .announce-dot { color: #c9a44a; font-size: 9px; }

  /* ─── COUNTDOWN ──────────────────────────────────────────── */
  .countdown {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 32px;
  }
  .countdown-label {
    font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
    color: var(--muted); font-weight: 500;
  }
  .countdown-units {
    display: flex; align-items: flex-end; gap: 6px;
  }
  .countdown-unit {
    display: flex; flex-direction: column; align-items: center;
    min-width: 52px;
    background: var(--green-deep); color: var(--champagne);
    padding: 10px 8px 6px;
  }
  .countdown-unit strong {
    font-family: var(--serif); font-size: 30px; font-weight: 300; line-height: 1;
  }
  .countdown-unit span {
    font-size: 8px; letter-spacing: .2em; text-transform: uppercase;
    opacity: .6; margin-top: 4px;
  }
  .countdown-sep {
    font-size: 24px; font-weight: 300; color: var(--green-deep);
    line-height: 1; padding-bottom: 14px; opacity: .4;
  }

  /* ─── BADGES DE ESCASSEZ ─────────────────────────────────── */
  .product-scarcity {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase;
    font-weight: 600; padding: 6px 12px;
    pointer-events: none; text-align: center;
  }
  .scarcity-last    { background: rgba(192,57,43,.92); color: #fff; }
  .scarcity-limited { background: rgba(160,112,40,.9); color: #fff; }
  .scarcity-special { background: rgba(24,64,54,.82);  color: var(--champagne); }

  /* ─── PREÇO REFRAMING ────────────────────────────────────── */
  .price-original { opacity: .38; font-size: 11px !important; }

  /* ─── SCARCITY NO MODAL ──────────────────────────────────── */
  .pd-scarcity {
    font-size: 12px; letter-spacing: .04em;
    color: #a33; font-weight: 500;
    padding: 10px 14px;
    background: rgba(192,57,43,.06);
    border-left: 3px solid #c0392b;
    margin-top: -24px;
  }

  /* ─── STICKY CTA MOBILE ──────────────────────────────────── */
  .sticky-cta { display: none; }

  /* ─── MOBILE OVERHAUL ────────────────────────────────────── */
  @media (max-width: 768px) {
    body { padding-bottom: 68px; }

    .sticky-cta {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: var(--green-deep); color: var(--champagne);
      padding: 16px 20px;
      font-size: 11px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600;
      text-decoration: none;

    /* Hero mobile */
    .hero { grid-template-columns: 1fr !important; min-height: auto; }
    .hero-copy { padding: 48px 24px 36px; order: 2; }
    .hero-jewel-stage { order: 1; min-height: 380px !important; }
    .hero-title { font-size: clamp(34px, 10vw, 54px) !important; }
    .hero-sub { font-size: 14px; }

    /* Countdown mobile */
    .countdown { margin-bottom: 24px; }
    .countdown-unit { min-width: 44px; padding: 8px 6px 4px; }
    .countdown-unit strong { font-size: 24px; }

    /* Collections mobile */
    .collections { padding: 48px 16px 16px; }
    .collection-header { margin-bottom: 20px; }
    .vitrine-stage { height: 260px; }
    .vitrine-item { width: 260px; height: 180px; }

    /* Topbar mobile */
    .topbar-inner { grid-template-columns: 1fr !important; gap: 12px; padding: 14px 20px !important; text-align: center; }

    .pd-modal { grid-template-columns: 1fr !important; }

    .pd-info { padding: 28px 20px; gap: 28px; }

  }

  @media (max-width: 420px) {
    .hero-title { font-size: 32px !important; }
    .hero-sub { font-size: 13px; }
    .hero-actions { flex-direction: column; gap: 10px; }

    .countdown-unit { min-width: 36px; }
    .countdown-unit strong { font-size: 20px; }
    .announce-campaign { font-size: 9px; letter-spacing: .18em; }
    .cg-root { padding: 40px 12px 32px; }
    .footer-inner { grid-template-columns: 1fr !important; }
  }
</style>

// ─── Countdown da campanha ───────────────────────────────────
function Countdown({ deadline }) {
  const calc = () => {
    const diff = Math.max(0, new Date(deadline) - Date.now());
    return {
      d: Math.floor(diff / 864e5),
      h: Math.floor((diff % 864e5) / 36e5),
      m: Math.floor((diff % 36e5) / 6e4),
      s: Math.floor((diff % 6e4) / 1e3),
    };
  };
  const [time, setTime] = useState(calc);
  useEffect(() => {
    const id = setInterval(() => setTime(calc()), 1000);
    return () => clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, '0');
  if (time.d === 0 && time.h === 0 && time.m === 0 && time.s === 0) return null;
  return (
    <div className="countdown">
      <span className="countdown-label">Campanha encerra em</span>
      <div className="countdown-units">
        <div className="countdown-unit"><strong>{time.d}</strong><span>dias</span></div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit"><strong>{pad(time.h)}</strong><span>horas</span></div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit"><strong>{pad(time.m)}</strong><span>min</span></div>
        <div className="countdown-sep">:</div>
        <div className="countdown-unit"><strong>{pad(time.s)}</strong><span>seg</span></div>
      </div>
    </div>
  );
}

function App() {

      // Index por ref para lookup rápido

        // Dados base hardcoded (para heroLabel etc.) — tenta match por ID

          id:       c.id,
          kicker:   c.kicker   || base.kicker  || 'COLEÇÃO',

          count: erpProducts.length,

          </TweaksPanel>
        </>);

}

// Helpers de cor
function hexToRgba(hex, a = 1) {
  const m = hex.replace('#', '');
  const bigint = parseInt(m.length === 3 ?
  m.split('').map((c) => c + c).join('') :
  m, 16);
  const r = bigint >> 16 & 255,g = bigint >> 8 & 255,b = bigint & 255;
  return `rgba(${r},${g},${b},${a})`;
}
function shade(hex, percent) {
  const m = hex.replace('#', '');
  const bigint = parseInt(m.length === 3 ?
  m.split('').map((c) => c + c).join('') :
  m, 16);
  let r = bigint >> 16 & 255,g = bigint >> 8 & 255,b = bigint & 255;
  const amt = percent / 100;
  r = Math.max(0, Math.min(255, Math.round(r + r * amt)));
  g = Math.max(0, Math.min(255, Math.round(g + g * amt)));
  b = Math.max(0, Math.min(255, Math.round(b + b * amt)));
  return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
}
