<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#184036" />
  <title>ALISSON ERP — Sem conexão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #184036;
      color: #F3EADA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 32px 24px;
    }
    img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 28px;
      opacity: 0.9;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      opacity: 0.65;
      line-height: 1.5;
      max-width: 260px;
    }
    button {
      margin-top: 32px;
      padding: 12px 28px;
      background: rgba(243, 234, 218, 0.15);
      border: 1px solid rgba(243, 234, 218, 0.3);
      color: #F3EADA;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:active { background: rgba(243, 234, 218, 0.25); }
  </style>
</head>
<body>
  <img src="/logo.leaoverde.webp" alt="Alisson ERP" />
  <h1>Sem conexão</h1>
  <p>Verifique sua internet e tente novamente.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
