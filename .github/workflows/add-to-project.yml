name: Adicionar PR ao quadro iAlisson

on:
  pull_request:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/Alisson-Joias/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
