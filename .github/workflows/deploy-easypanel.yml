name: Deploy no EasyPanel

# Monta o sistema no EasyPanel automaticamente a cada publicacao no main.
# O link de disparo fica no cofre do GitHub (Settings > Secrets), nunca no codigo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no EasyPanel
        env:
          HOOK: ${{ secrets.EASYPANEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Secret EASYPANEL_DEPLOY_HOOK ainda nao configurado. Deploy pulado."
            exit 0
          fi
          echo "Disparando deploy no EasyPanel..."
          curl -fsS -X POST "$HOOK" && echo "" && echo "Deploy disparado com sucesso."
